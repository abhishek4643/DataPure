      <circle cx="10" cy="11" r="3" fill="#7C3AED"/>
      <text x="20" y="14.5" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Indexed Hash Lookup Table</text>
