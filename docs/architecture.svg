    <line x1="20" y1="140" x2="900" y2="140"/>
    <line x1="20" y1="200" x2="900" y2="200"/>
    <line x1="20" y1="260" x2="900" y2="260"/>
    <line x1="120" y1="10" x2="120" y2="290"/>
    <line x1="230" y1="10" x2="230" y2="290"/>
    <line x1="340" y1="10" x2="340" y2="290"/>
    <line x1="450" y1="10" x2="450" y2="290"/>
    <line x1="560" y1="10" x2="560" y2="290"/>
