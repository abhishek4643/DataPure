<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <filter id="principle-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="180" rx="12" fill="#0B0F19"/>
  <rect x="1" y="1" width="918" height="178" rx="11" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Card 1: User-Centered (#818CF8) -->
  <g transform="translate(18, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#818CF8" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <!-- User Icon -->
    <circle cx="34" cy="28" r="5" fill="none" stroke="#818CF8" stroke-width="1.8"/>
    <path d="M 24 43 C 24 38 29 36 34 36 C 39 36 44 38 44 43" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">User-Centered</text>
    <text x="62" y="46" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Actionable Clarity</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" line-height="1.4">
      <tspan x="16" dy="0">Interactive audit queue with live</tspan>
      <tspan x="16" dy="16">similarity scoring, instant manual</tspan>
      <tspan x="16" dy="16">overrides, and granular logging.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="84" height="18" rx="4" fill="#1E1B4B"/>
    <text x="58" y="132.5" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Audit Workflow</text>
  </g>

  <!-- Card 2: Minimal & Clean (#34D399) -->
  <g transform="translate(242, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <!-- Clean Sparkle / Layer Icon -->
    <path d="M 34 22 L 36 29 L 43 31 L 36 33 L 34 40 L 32 33 L 25 31 L 32 29 Z" fill="#34D399"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Minimal &amp; Clean</text>
    <text x="62" y="46" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Zero Ingestion Bloat</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">Noise-free telemetry displays,</tspan>
      <tspan x="16" dy="16">pruned SQL schemas, and sub-ms</tspan>
      <tspan x="16" dy="16">normalized string parsing.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="76" height="18" rx="4" fill="#064E3B"/>
    <text x="54" y="132.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Sub-ms Parse</text>
  </g>

  <!-- Card 3: Consistent (#EC4899) -->
  <g transform="translate(466, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#EC4899" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#500724" stroke="#EC4899" stroke-width="1"/>
    <!-- Grid / Layout Icon -->
    <rect x="25" y="24" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="35" y="24" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="25" y="34" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="35" y="34" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Consistent</text>
    <text x="62" y="46" fill="#EC4899" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Deterministic Logic</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">Deterministic SHA-256 hashing</tspan>
      <tspan x="16" dy="16">paired with calibrated RapidFuzz</tspan>
      <tspan x="16" dy="16">thresholds for zero variance.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="80" height="18" rx="4" fill="#500724"/>
    <text x="56" y="132.5" text-anchor="middle" fill="#F472B6" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Deterministic</text>
  </g>

  <!-- Card 4: Accessible (#38BDF8) -->
  <g transform="translate(690, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <!-- Eye / Accessible Icon -->
    <circle cx="34" cy="34" r="3" fill="#38BDF8"/>
    <path d="M 23 34 C 26 27 42 27 45 34 C 42 41 26 41 23 34 Z" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Accessible</text>
    <text x="62" y="46" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">High-Contrast UI</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">WCAG AA contrast ratios across</tspan>
      <tspan x="16" dy="16">all status pills, charts, and screen-</tspan>
      <tspan x="16" dy="16">reader-friendly table telemetry.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="70" height="18" rx="4" fill="#0C4A6E"/>
    <text x="51" y="132.5" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">WCAG AA</text>
  </g>
</svg>

